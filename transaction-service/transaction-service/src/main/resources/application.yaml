server:
  port: 8083

spring:
  application:
    name: transaction-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:transactiondb}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:data_archive}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

      acks: all
      retries: 3

# Kafka topic configuration
app:
  kafka:
    topics:
      transaction-completed: transaction-completed
      transaction-reversed: transaction-reversed

# Feign configuration (direct URL-based calls for now)
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: full

# Downstream service URLs (no Eureka yet)
services:
  account:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.cloud.openfeign: debug

# Kafka secret
aes:
  secret: ${AES_SECRET}

# Daily transfer limit
transfer:
  daily-limit: 5000

# Payment reversal time limit
payment:
  reversal:
    allowed-hours: 24