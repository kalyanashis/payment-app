server:
  port: 8084

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:notificationdb}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:data_archive}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer:
        org.apache.kafka.common.serialization.StringSerializer
      value-serializer:
        org.apache.kafka.common.serialization.StringSerializer

    consumer:
      group-id: notification-group
      auto-offset-reset: earliest

      key-deserializer:
        org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer:
        org.apache.kafka.common.serialization.StringDeserializer

      properties:
        spring.json.trusted.packages: "*"

        spring.json.use.type.headers: false

        spring.json.value.default.type:
          payment.app.notification_service.kafka.event.TransactionCompletedEvent

# Kafka secret
aes:
  secret: ${AES_SECRET}

# Kafka topic configuration
app:
  kafka:
    topics:
      transaction-completed: transaction-completed
      transaction-reversed: transaction-reversed
